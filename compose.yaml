services:
  mariadb:
    image: mariadb
    container_name: amatl-mariadb
    restart: unless-stopped  
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: amatl
      MYSQL_USER: user
      MYSQL_PASSWORD: changeme
    volumes:
      - mariadb-data:/var/lib/mysql

  amatl:
    build:
      context: .
      dockerfile: ./misc/docker/Dockerfile
    container_name: amatl
    restart: unless-stopped  
    image: reg.cadoles.com/envole/amatl
    depends_on: 
      - mariadb
    ports:
      - "8029:80"
    volumes:
      - ./config:/app/config:delegated
      - ./src:/app/src:delegated
      - ./templates:/app/templates:delegated
      - ./public:/app/public:delegated
      - ./uploads:/app/uploads:delegated
      - ./.env:/app/.env:delegated
      - ./.env.local:/app/.env.local:delegated

volumes:
  mariadb-data:
  corpus_data:

